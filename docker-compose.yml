services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: pasarguard-panel:local
    container_name: ${APP_NAME:-pg-panel}
    restart: always
    env_file: .env
    ports:
      - "${PANEL_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-/var/lib/pg-panel}:/var/lib/pg-panel
